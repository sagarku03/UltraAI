name: Build JARVIS AI Android APK

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Configure SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare .env Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Generate debug.keystore for SigningConfig
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore || true
            fi
          fi
          if [ ! -s debug.keystore ]; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Gradle Wrapper Timeout & Permissions
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/networkTimeout=10000/networkTimeout=120000/g' gradle/wrapper/gradle-wrapper.properties
          fi
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build Debug APKs (Termux & Standard Flavors)
        run: |
          for attempt in 1 2 3; do
            echo "=== Gradle Assemble Attempt $attempt ==="
            if [ -f ./gradlew ]; then
              ./gradlew :app:assembleTermuxDebug :app:assembleStandardDebug \
                --no-daemon \
                --stacktrace \
                -Dorg.gradle.internal.http.connectionTimeout=120000 \
                -Dorg.gradle.internal.http.socketTimeout=120000 && break
            else
              gradle :app:assembleTermuxDebug :app:assembleStandardDebug \
                --no-daemon \
                --stacktrace \
                -Dorg.gradle.internal.http.connectionTimeout=120000 \
                -Dorg.gradle.internal.http.socketTimeout=120000 && break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts."
              exit 1
            fi
            echo "Transient network timeout detected; retrying in 5 seconds..."
            sleep 5
          done

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apks
          find app/build/outputs/apk -name "*.apk" -exec cp {} output_apks/ \;
          ls -la output_apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-APKs
          path: output_apks/*.apk
          if-no-files-found: error
          retention-days: 30
